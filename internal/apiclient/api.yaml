openapi: 3.0.0
info:
  title: Anthropic API
  version: 1.0.0
servers:
  - url: https://api.anthropic.com
    description: Anthropic API
    variables: {}
paths:
  /v1/organizations/users:
    get:
      operationId: listUsers
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
        - name: before_id
          in: query
          schema:
            type: string
        - name: after_id
          in: query
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - has_more
                  - first_id
                  - last_id
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/User"
                  has_more:
                    type: boolean
                  first_id:
                    type: string
                    nullable: true
                  last_id:
                    type: string
                    nullable: true
  /v1/organizations/users/{user_id}:
    get:
      operationId: getUser
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
  /v1/organizations/invites:
    get:
      operationId: listInvites
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
        - name: before_id
          in: query
          schema:
            type: string
        - name: after_id
          in: query
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - has_more
                  - first_id
                  - last_id
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Invite"
                  has_more:
                    type: boolean
                  first_id:
                    type: string
                    nullable: true
                  last_id:
                    type: string
                    nullable: true
    post:
      operationId: createInvite
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - role
              properties:
                email:
                  type: string
                role:
                  type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invite"
  /v1/organizations/invites/{invite_id}:
    get:
      operationId: getInvite
      parameters:
        - name: invite_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invite"
    delete:
      operationId: deleteInvite
      parameters:
        - name: invite_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invite"
  /v1/organizations/workspaces:
    get:
      operationId: listWorkspaces
      parameters:
        - name: include_archived
          in: query
          schema:
            type: boolean
        - name: limit
          in: query
          schema:
            type: integer
        - name: before_id
          in: query
          schema:
            type: string
        - name: after_id
          in: query
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - has_more
                  - first_id
                  - last_id
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Workspace"
                  has_more:
                    type: boolean
                  first_id:
                    type: string
                    nullable: true
                  last_id:
                    type: string
                    nullable: true
    post:
      operationId: createWorkspace
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"
  /v1/organizations/workspaces/{workspace_id}:
    get:
      operationId: getWorkspace
      parameters:
        - name: workspace_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"
    post:
      operationId: updateWorkspace
      parameters:
        - name: workspace_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"
  /v1/organizations/workspaces/{workspace_id}/archive:
    post:
      operationId: archiveWorkspace
      parameters:
        - name: workspace_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"
  /v1/organizations/workspaces/{workspace_id}/members:
    get:
      operationId: listWorkspaceMembers
      parameters:
        - name: workspace_id
          in: path
          required: true
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
        - name: before_id
          in: query
          schema:
            type: string
        - name: after_id
          in: query
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - has_more
                  - first_id
                  - last_id
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/WorkspaceMember"
                  has_more:
                    type: boolean
                  first_id:
                    type: string
                    nullable: true
                  last_id:
                    type: string
                    nullable: true
    post:
      operationId: createWorkspaceMember
      parameters:
        - name: workspace_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - user_id
                - workspace_role
              properties:
                user_id:
                  type: string
                workspace_role:
                  type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceMember"
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/organizations/workspaces/{workspace_id}/members/{user_id}:
    get:
      operationId: getWorkspaceMember
      parameters:
        - name: workspace_id
          in: path
          required: true
          schema:
            type: string
        - name: user_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceMember"
    post:
      operationId: updateWorkspaceMember
      parameters:
        - name: workspace_id
          in: path
          required: true
          schema:
            type: string
        - name: user_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - workspace_role
              properties:
                workspace_role:
                  type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceMember"
    delete:
      operationId: deleteWorkspaceMember
      parameters:
        - name: workspace_id
          in: path
          required: true
          schema:
            type: string
        - name: user_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceMember"
  /v1/agents:
    get:
      operationId: listAgents
      parameters:
        - name: include_archived
          in: query
          schema:
            type: boolean
        - name: limit
          in: query
          schema:
            type: integer
        - name: before_id
          in: query
          schema:
            type: string
        - name: after_id
          in: query
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - has_more
                  - first_id
                  - last_id
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Agent"
                  has_more:
                    type: boolean
                  first_id:
                    type: string
                    nullable: true
                  last_id:
                    type: string
                    nullable: true
    post:
      operationId: createAgent
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - model
              properties:
                name:
                  type: string
                model:
                  $ref: "#/components/schemas/Model"
                system:
                  type: string
                  nullable: true
                description:
                  type: string
                  nullable: true
                tools:
                  type: array
                  nullable: true
                  items:
                    $ref: "#/components/schemas/AgentTool"
                mcp_servers:
                  type: array
                  nullable: true
                  items:
                    $ref: "#/components/schemas/MCPServer"
                skills:
                  type: array
                  nullable: true
                  items:
                    $ref: "#/components/schemas/Skill"
                multiagent:
                  nullable: true
                  allOf:
                    - $ref: "#/components/schemas/Multiagent"
                metadata:
                  type: object
                  additionalProperties:
                    type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/agents/{agent_id}:
    get:
      operationId: getAgent
      parameters:
        - name: agent_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"
    post:
      operationId: updateAgent
      parameters:
        - name: agent_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - version
              properties:
                version:
                  type: integer
                name:
                  type: string
                model:
                  $ref: "#/components/schemas/Model"
                system:
                  type: string
                  nullable: true
                description:
                  type: string
                  nullable: true
                tools:
                  type: array
                  nullable: true
                  items:
                    $ref: "#/components/schemas/AgentTool"
                mcp_servers:
                  type: array
                  nullable: true
                  items:
                    $ref: "#/components/schemas/MCPServer"
                skills:
                  type: array
                  nullable: true
                  items:
                    $ref: "#/components/schemas/Skill"
                multiagent:
                  nullable: true
                  allOf:
                    - $ref: "#/components/schemas/Multiagent"
                metadata:
                  type: object
                  additionalProperties:
                    type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/agents/{agent_id}/archive:
    post:
      operationId: archiveAgent
      parameters:
        - name: agent_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"
  /v1/environments:
    get:
      operationId: listEnvironments
      parameters:
        - name: include_archived
          in: query
          schema:
            type: boolean
        - name: limit
          in: query
          schema:
            type: integer
        - name: before_id
          in: query
          schema:
            type: string
        - name: after_id
          in: query
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - has_more
                  - first_id
                  - last_id
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Environment"
                  has_more:
                    type: boolean
                  first_id:
                    type: string
                    nullable: true
                  last_id:
                    type: string
                    nullable: true
    post:
      operationId: createEnvironment
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - config
              properties:
                name:
                  type: string
                config:
                  $ref: "#/components/schemas/EnvironmentConfig"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Environment"
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/environments/{environment_id}:
    get:
      operationId: getEnvironment
      parameters:
        - name: environment_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Environment"
    delete:
      operationId: deleteEnvironment
      parameters:
        - name: environment_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Environment"
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/environments/{environment_id}/archive:
    post:
      operationId: archiveEnvironment
      parameters:
        - name: environment_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Environment"
  /v1/vaults:
    get:
      operationId: listVaults
      parameters:
        - name: include_archived
          in: query
          schema:
            type: boolean
        - name: limit
          in: query
          schema:
            type: integer
        - name: before_id
          in: query
          schema:
            type: string
        - name: after_id
          in: query
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - has_more
                  - first_id
                  - last_id
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Vault"
                  has_more:
                    type: boolean
                  first_id:
                    type: string
                    nullable: true
                  last_id:
                    type: string
                    nullable: true
    post:
      operationId: createVault
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - display_name
              properties:
                display_name:
                  type: string
                metadata:
                  type: object
                  additionalProperties:
                    type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vault"
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/vaults/{vault_id}:
    get:
      operationId: getVault
      parameters:
        - name: vault_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vault"
    post:
      operationId: updateVault
      parameters:
        - name: vault_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                display_name:
                  type: string
                metadata:
                  type: object
                  additionalProperties:
                    type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vault"
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteVault
      parameters:
        - name: vault_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vault"
  /v1/vaults/{vault_id}/archive:
    post:
      operationId: archiveVault
      parameters:
        - name: vault_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vault"
security:
  - apiKeyAuth: []
  - versionHeader: []
components:
  securitySchemes:
    apiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
    versionHeader:
      type: apiKey
      in: header
      name: anthropic-version
  schemas:
    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - type
            - message
          properties:
            type:
              type: string
            message:
              type: string
    Invite:
      type: object
      required:
        - id
        - email
        - role
        - status
        - created_at
        - expires_at
      properties:
        id:
          type: string
        email:
          type: string
        role:
          type: string
        status:
          type: string
        created_at:
          type: string
        expires_at:
          type: string
    User:
      type: object
      required:
        - id
        - name
        - email
        - role
        - added_at
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
        role:
          type: string
        added_at:
          type: string
    Workspace:
      type: object
      required:
        - id
        - name
        - created_at
        - archived_at
        - display_color
      properties:
        id:
          type: string
        name:
          type: string
        created_at:
          type: string
        archived_at:
          type: string
          nullable: true
        display_color:
          type: string
    WorkspaceMember:
      type: object
      required:
        - user_id
        - workspace_id
        - workspace_role
      properties:
        user_id:
          type: string
        workspace_id:
          type: string
        workspace_role:
          type: string
    Model:
      type: object
      required:
        - id
      properties:
        id:
          type: string
        speed:
          type: string
        version:
          type: string
    PermissionPolicy:
      type: object
      required:
        - type
      properties:
        type:
          type: string
    ToolConfig:
      type: object
      properties:
        name:
          type: string
        enabled:
          type: boolean
        permission_policy:
          $ref: "#/components/schemas/PermissionPolicy"
    AgentTool:
      type: object
      required:
        - type
      properties:
        type:
          type: string
        default_config:
          $ref: "#/components/schemas/ToolConfig"
        configs:
          type: array
          items:
            $ref: "#/components/schemas/ToolConfig"
        mcp_server_name:
          type: string
        name:
          type: string
        description:
          type: string
        input_schema:
          type: object
          additionalProperties: true
        permission_policy:
          $ref: "#/components/schemas/PermissionPolicy"
    MCPServer:
      type: object
      required:
        - type
        - name
      properties:
        type:
          type: string
        name:
          type: string
        url:
          type: string
    Skill:
      type: object
      required:
        - type
        - skill_id
      properties:
        type:
          type: string
        skill_id:
          type: string
        version:
          type: string
    RosterEntry:
      type: object
      required:
        - type
      properties:
        type:
          type: string
        id:
          type: string
        version:
          type: integer
    Multiagent:
      type: object
      required:
        - type
        - agents
      properties:
        type:
          type: string
        agents:
          type: array
          items:
            $ref: "#/components/schemas/RosterEntry"
    Agent:
      type: object
      required:
        - id
        - type
        - name
        - model
        - version
        - created_at
        - updated_at
      properties:
        id:
          type: string
        type:
          type: string
        name:
          type: string
        model:
          $ref: "#/components/schemas/Model"
        system:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        tools:
          type: array
          nullable: true
          items:
            $ref: "#/components/schemas/AgentTool"
        mcp_servers:
          type: array
          nullable: true
          items:
            $ref: "#/components/schemas/MCPServer"
        skills:
          type: array
          nullable: true
          items:
            $ref: "#/components/schemas/Skill"
        multiagent:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/Multiagent"
        metadata:
          type: object
          additionalProperties:
            type: string
        version:
          type: integer
        created_at:
          type: string
        updated_at:
          type: string
        archived_at:
          type: string
          nullable: true
    Networking:
      type: object
      required:
        - type
      properties:
        type:
          type: string
        allowed_hosts:
          type: array
          items:
            type: string
        allow_mcp_servers:
          type: boolean
        allow_package_managers:
          type: boolean
    Packages:
      type: object
      properties:
        apt:
          type: array
          items:
            type: string
        cargo:
          type: array
          items:
            type: string
        gem:
          type: array
          items:
            type: string
        go:
          type: array
          items:
            type: string
        npm:
          type: array
          items:
            type: string
        pip:
          type: array
          items:
            type: string
    EnvironmentConfig:
      type: object
      required:
        - type
        - networking
      properties:
        type:
          type: string
        networking:
          $ref: "#/components/schemas/Networking"
        packages:
          $ref: "#/components/schemas/Packages"
    Environment:
      type: object
      required:
        - id
        - type
        - name
        - config
        - created_at
        - updated_at
      properties:
        id:
          type: string
        type:
          type: string
        name:
          type: string
        config:
          $ref: "#/components/schemas/EnvironmentConfig"
        created_at:
          type: string
        updated_at:
          type: string
        archived_at:
          type: string
          nullable: true
    Vault:
      type: object
      required:
        - id
        - type
        - display_name
        - created_at
        - updated_at
      properties:
        id:
          type: string
        type:
          type: string
        display_name:
          type: string
        metadata:
          type: object
          additionalProperties:
            type: string
        created_at:
          type: string
        updated_at:
          type: string
        archived_at:
          type: string
          nullable: true
