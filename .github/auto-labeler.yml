# Each key is a label. It applies when any matcher in its list holds; a matcher
# holds when all its conditions hold. Labels missing from the repo are skipped.
breaking-change:
  - title: '^\w+(\([^)]*\))?!:'
  - body: '^BREAKING[ -]CHANGE:'

enhancement:
  - title: '^feat(\([^)]*\))?!?:'

bug:
  # fix(deps): is a dependency update, labeled dependencies only.
  - title: '^fix(\([^)]*\))?!?:'
    not:
      title: '^fix\(deps\)!?:'

documentation:
  - title: '^docs(\([^)]*\))?!?:'
  # Fallback for titles without a Conventional Commit type.
  - files:
      - '**/*.md'
      - '**/*.mdx'
      - '**/*.rst'
      - docs/**
      - mkdocs.yml
    not:
      title: &typed '^(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)(\([^)]*\))?!?:'

dependencies:
  - title: '^\w+\(deps\)!?:'
  - author:
      - renovate[bot]
      - dependabot[bot]
  - files:
      - '**/uv.lock'
      - '**/poetry.lock'
      - '**/package-lock.json'
      - '**/pnpm-lock.yaml'
      - '**/yarn.lock'
      - '**/bun.lock'
      - '**/bun.lockb'
      - '**/go.sum'
      - '**/Cargo.lock'
      - '**/Gemfile.lock'
      - '**/composer.lock'
    not:
      title: *typed

maintenance:
  - title: '^(build|chore|ci|perf|refactor|revert|style|test)(\([^)]*\))?!?:'
  - files:
      - .github/**
      - .pre-commit-config.yaml
      - renovate.json
      - renovate.json5
      - .gitignore
    not:
      title: *typed
